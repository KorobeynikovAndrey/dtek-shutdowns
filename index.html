<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101523">
<title>Графики отключений ДТЭК</title>
<style>
:root{color-scheme:dark;--bg:#0e1320;--panel:#171e2e;--border:#354052;--text:#f2f4f8;--muted:#aeb8ca;--green:#63c76b;--red:#ff5e65;--yellow:#ffd052;--unknown:#465062;--group-width:108px;--header-height:52px;--row-height:34px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.container{width:calc(100% - 36px);margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:28px;height:36px;color:#ffca25;flex:none}
h1{font-size:clamp(20px,2.3vw,30px);margin:0;letter-spacing:-.025em}
.update{display:flex;align-items:center;gap:14px;color:var(--muted);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.refresh{display:grid;place-items:center;background:none;border:0;padding:5px}
.refresh svg{width:22px;height:22px}
.tabs{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:8px 0 22px}
.group-select{display:flex;align-items:center;gap:6px;margin-left:auto}
.group-select select,.group-reset{font:inherit;color:var(--text);background:#20283b;border:1px solid var(--border);border-radius:10px;height:46px}
.group-select select{padding:0 12px;min-width:126px;cursor:pointer}
.group-reset{display:grid;place-items:center;width:40px;padding:0}
.group-reset svg{width:18px;height:18px}
.group-reset:hover{background:#303b50}
.tab{padding:11px 22px;border:1px solid var(--border);border-radius:10px;background:#20283b;font-size:16px}
.tab.active{background:#1769d8;border-color:#388cf4;font-weight:650}
[hidden]{display:none!important}
.timeline-viewport{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#52617a transparent}
.timeline{display:grid;grid-template-columns:var(--group-width) minmax(0,1fr);min-width:1030px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#121827}
.timeline:has(.now-marker){overflow:visible;margin-bottom:34px}
.timeline:has(.now-marker) .labels{border-radius:11px 0 0 11px;overflow:hidden}
.timeline:has(.now-marker) .hour-axis{border-top-right-radius:11px}
.labels,.timeline-shell{min-width:0}
.labels{border-right:1px solid var(--border);background:#171e2e}
.label{height:var(--row-height);display:flex;align-items:center;justify-content:center;font-weight:650;border-bottom:1px solid var(--border);white-space:nowrap}
.label:last-child{border-bottom:0}
.label.selected{background:#25483e;color:#e5fff0}
.label.dimmed{color:var(--muted)}
.timeline-strip.dimmed .hour-bar{filter:grayscale(1) brightness(.58)}
.label.header{height:var(--header-height);font-weight:700}
.timeline-shell{position:relative}
.hour-axis,.timeline-strip{display:grid;grid-template-columns:repeat(24,minmax(0,1fr))}
.hour-axis{height:var(--header-height);border-bottom:1px solid var(--border);background:#171e2e}
.hour-label{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);font-size:13px;font-variant-numeric:tabular-nums;font-weight:650}
.hour-label:last-child,.hour-cell:last-child{border-right:0}
.timeline-strip{height:var(--row-height);border-bottom:1px solid var(--border)}
.timeline-strip:last-of-type{border-bottom:0}
.hour-cell{position:relative;display:flex;align-items:center;min-width:0;padding:0 4px;border-right:1px solid var(--border)}
.hour-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 17px ui-monospace,SFMono-Regular,Consolas,monospace;color:#ffdf45;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none}
.hour-bar{display:flex;width:100%;height:18px;overflow:hidden;border-radius:5px;background:var(--unknown)}
.slot{width:50%;min-width:0}
.slot.on,.legend-color.on{background:var(--green)}
.slot.off,.legend-color.off{background:var(--red)}
.slot.maybe,.legend-color.maybe{background:var(--yellow)}
.slot.unknown{background:var(--unknown)}
.hour-bar.same .slot:first-child{border-right:1px solid #0003}
.past-hours{position:absolute;z-index:2;top:var(--header-height);bottom:0;left:0;width:0;backdrop-filter:blur(2px);pointer-events:none}
.now-marker{position:absolute;z-index:3;top:var(--header-height);bottom:0;width:1px;background:rgba(255,255,255,.55);transform:translateX(-50%);pointer-events:none}
.now-marker::before{content:"";position:absolute;bottom:-6px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid #fff}
.now-time{position:absolute;top:calc(100% + 7px);left:0;transform:translateX(-50%);background:#f1f4f8;color:#101523;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:700;white-space:nowrap}
.now-marker.start .now-time{transform:none}
.now-marker.end .now-time{transform:translateX(-100%)}
.legend{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:20px;padding:15px 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.legend-item{display:flex;align-items:center;gap:9px}
.legend-color{width:28px;height:18px;border-radius:5px;display:inline-block}
.empty{padding:28px;color:var(--muted);border:1px solid var(--border);border-radius:10px}
.footer{display:flex;justify-content:space-between;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
a{color:inherit;text-decoration:none}
a:hover{color:var(--text)}
@media(max-width:650px){.container{width:calc(100% - 20px)}.topbar{align-items:flex-start;flex-wrap:wrap;padding:15px 0}.update{font-size:12px}.tab{font-size:14px;padding:9px 13px}.legend{gap:12px;padding:12px;font-size:12px}.footer{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
    <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 24 32" fill="currentColor"><path d="M12 0 1 18h9L8 32l15-20h-9L17 0z"/></svg>
        <h1>Графики отключений ДТЭК</h1>
    </div>
    <div class="update"><span id="last-update">Обновлено: —</span><button class="refresh" id="refresh" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v6h-6"/></svg></button></div>
</header>
<main>
    <nav class="tabs" aria-label="День">
        <button class="tab active" id="today-tab">Сегодня</button>
        <button class="tab" id="tomorrow-tab" hidden>Завтра</button>
        <div class="group-select">
            <select id="group-select" aria-label="Группа"><option value="">Все группы</option></select>
            <button class="group-reset" id="group-reset" title="Сбросить выбор" aria-label="Сбросить выбор" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
    </nav>
    <div class="timeline-viewport" id="schedule"><div class="empty">Загрузка…</div></div>
    <div class="legend">
        <span class="legend-item"><i class="legend-color on"></i>Есть свет</span>
        <span class="legend-item"><i class="legend-color off"></i>Нет света</span>
        <span class="legend-item"><i class="legend-color maybe"></i>Возможно отключение</span>
    </div>
</main>
<footer class="footer"><a href="https://www.dtek-dnem.com.ua/ua/shutdowns" target="_blank" rel="noopener noreferrer">Источник: ДТЭК</a><span>Киевское время · Автообновление: 5 мин</span></footer>
</div>
<script>
const timeZone = 'Europe/Kyiv';
let group = localStorage.getItem('group') || '';
const dateFormatter = new Intl.DateTimeFormat('en-GB', {timeZone, year:'numeric', month:'2-digit', day:'2-digit'});
const tabFormatter = new Intl.DateTimeFormat('ru-RU', {timeZone,day:'numeric',month:'long'});
const types = {yes:['on','on'],no:['off','off'],first:['off','on'],second:['on','off'],maybe:['maybe','maybe'],mfirst:['maybe','on'],msecond:['on','maybe']};
let schedules = {};
let activeDay = 'today';
let todayKey = '';

function dateKey(date) {
    const parts = Object.fromEntries(dateFormatter.formatToParts(date).map(p => [p.type,p.value]));
    return parts.year+'-'+parts.month+'-'+parts.day;
}

function nextDay(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10);
}

function minutesNow() {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {timeZone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p => [p.type,p.value]));
    return Number(parts.hour)*60+Number(parts.minute);
}

function clockTime(min) {
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
}

function slotsOf(json, key) {
    if (!json || !json.data) return null;
    const entry = Object.entries(json.data).find(([stamp]) => dateKey(new Date(Number(stamp)*1000))===key);
    if (!entry) return null;
    const groups = entry[1];
    if (!groups || typeof groups!=='object') return null;
    const result = Object.entries(groups).filter(([,hours])=>hours && typeof hours==='object' && Object.hasOwn(hours,'1')).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true})).map(([name,hours])=>({
        name, slots:Array.from({length:24},(_,i)=>Object.hasOwn(types,hours[i+1])?types[hours[i+1]]:['unknown','unknown'])
    }));
    return result.length?result:null;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderTimeline(rows, today) {
    const selected = rows.some(row=>row.name===group);
    const labels = '<div class="label header">Группа</div>'+rows.map(row=>'<div class="label'+(selected?(row.name===group?' selected':' dimmed'):'')+'">'+escapeHtml(row.name)+'</div>').join('');
    const axis = Array.from({length:24},(_,i)=>'<span class="hour-label">'+String(i).padStart(2,'0')+'</span>').join('');
    const strips = rows.map(row=>'<div class="timeline-strip'+(selected&&row.name!==group?' dimmed':'')+'">'+row.slots.map(([a,b],i)=>{
        const names={on:'Есть свет',off:'Нет света',maybe:'Возможно отключение',unknown:'Нет данных'};
        const title=clockTime(i*60)+'–'+clockTime(i*60+30)+': '+names[a]+'; '+clockTime(i*60+30)+'–'+clockTime((i+1)*60)+': '+names[b];
        const hourText=selected&&row.name===group?'<span class="hour-text">'+String(i).padStart(2,'0')+'</span>':'';
        return '<div class="hour-cell" title="'+title+'"><div class="hour-bar'+(a===b?' same':'')+'"><div class="slot '+a+'"></div><div class="slot '+b+'"></div></div>'+hourText+'</div>';
    }).join('')+'</div>').join('');
    const marker = today?'<div class="past-hours" id="past-hours" aria-hidden="true"></div><div class="now-marker" id="now-marker" aria-hidden="true"><span class="now-time" id="now-time"></span></div>':'';
    return '<div class="timeline"><div class="labels">'+labels+'</div><div class="timeline-shell"><div class="hour-axis">'+axis+'</div>'+strips+marker+'</div></div>';
}

async function fetchSchedule(file) {
    const response=await fetch(file+'?v='+Date.now(), {cache:'no-store'});
    if(response.status===404) return null;
    if(!response.ok) throw new Error('HTTP '+response.status);
    return response.json();
}

function updateStatus() {
    const marker=document.getElementById('now-marker');
    if(!marker) return;
    const pastHours=document.getElementById('past-hours');
    if(dateKey(new Date())!==todayKey){marker.hidden=true;pastHours.hidden=true;return;}
    const minutes=minutesNow();
    marker.hidden=false;
    pastHours.hidden=false;
    marker.style.left=pastHours.style.width=(minutes/1440*100)+'%';
    marker.classList.toggle('start',minutes<35);
    marker.classList.toggle('end',minutes>1405);
    document.getElementById('now-time').textContent=clockTime(minutes);
}

function renderGroupSelect() {
    const groups = [...new Set(Object.values(schedules).flatMap(item=>(item.rows||[]).map(row=>row.name)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const select=document.getElementById('group-select');
    select.innerHTML='<option value="">Все группы</option>'+groups.map(name=>'<option value="'+escapeHtml(name)+'">'+escapeHtml(name)+'</option>').join('');
    select.value=groups.includes(group)?group:'';
    document.getElementById('group-reset').hidden=!group;
}

function renderDay() {
    const item=schedules[activeDay];
    renderGroupSelect();
    document.getElementById('today-tab').classList.toggle('active',activeDay==='today');
    document.getElementById('tomorrow-tab').classList.toggle('active',activeDay==='tomorrow');
    document.getElementById('last-update').textContent='Обновлено: '+(item?.update||'—');
    document.getElementById('schedule').innerHTML=item?.rows?renderTimeline(item.rows,activeDay==='today'):'<div class="empty">'+(item?.error?'Ошибка загрузки графика':'График недоступен')+'</div>';
    updateStatus();
}

async function loadSchedules() {
    const today=dateKey(new Date());
    const tomorrow=nextDay(today);
    if(todayKey && todayKey!==today) activeDay='today';
    todayKey=today;
    document.getElementById('today-tab').textContent='Сегодня, '+tabFormatter.format(new Date(today+'T12:00:00Z'));
    document.getElementById('tomorrow-tab').textContent='Завтра, '+tabFormatter.format(new Date(tomorrow+'T12:00:00Z'));
    await Promise.all([['today',today],['tomorrow',tomorrow]].map(async ([name,key])=>{
        try {
            const json=await fetchSchedule(name+'.json');
            schedules[name]={rows:slotsOf(json,key),update:json?.update};
        } catch(err) {
            schedules[name]={rows:null,error:true};
            console.error(name,err);
        }
    }));
    document.getElementById('tomorrow-tab').hidden=!schedules.tomorrow.rows;
    if(activeDay==='tomorrow'&&!schedules.tomorrow.rows) activeDay='today';
    renderDay();
}

document.getElementById('today-tab').onclick=()=>{activeDay='today';renderDay();};
document.getElementById('tomorrow-tab').onclick=()=>{activeDay='tomorrow';renderDay();};
document.getElementById('group-select').onchange=event=>{
    group=event.target.value;
    if(group) localStorage.setItem('group',group);
    else localStorage.removeItem('group');
    renderDay();
};
document.getElementById('group-reset').onclick=()=>{
    group='';
    localStorage.removeItem('group');
    renderDay();
};
document.getElementById('refresh').onclick=loadSchedules;
loadSchedules();
setInterval(()=>{
    if(todayKey!==dateKey(new Date())) loadSchedules();
    else updateStatus();
},30*1000);
setInterval(loadSchedules,5*60*1000);
</script>
</body>
</html>
