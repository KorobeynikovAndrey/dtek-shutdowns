<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101c25">
<meta name="description" content="График отключений ДТЭК GPV4.2">
<title>График отключений · GPV4.2</title>
<style>
:root{color-scheme:dark;--bg:#101d26;--panel:#14232e;--border:#304753;--text:#ecf4f7;--muted:#93aab5;--cyan:#24d8e6;--green:#23c98e;--red:#f05158}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
a:hover{color:var(--cyan)}
.container{width:min(1380px,calc(100% - 40px));margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:21px 0 19px;border-bottom:2px solid var(--cyan)}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:28px;height:35px;color:var(--cyan);flex:none}
h1{font-size:clamp(19px,2.1vw,26px);font-weight:700;letter-spacing:-.035em;margin:0}
.group{padding:4px 11px;border:1px solid var(--cyan);border-radius:7px;color:var(--cyan);font:700 16px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}
main{padding:21px 0 24px}
.status-card,.day-card,.footer{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.status-card{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:88px;padding:14px 24px;margin-bottom:18px}
.status-caption{font-size:12px;font-weight:600;color:var(--muted)}
.status-name{margin-top:2px;font-size:23px;font-weight:650;letter-spacing:-.03em;color:var(--green)}
.status-card.off .status-name{color:var(--red)}
.status-card.unknown .status-name{color:var(--muted)}
.legend{display:flex;align-items:center;gap:27px;flex-wrap:wrap;font-size:13px}
.legend-item{display:flex;align-items:center;gap:9px;white-space:nowrap}
.legend-color{display:inline-block;flex:none;width:19px;height:19px;border-radius:5px;background:var(--green)}
.legend-color.off{background:var(--red)}
.day-stack{display:grid;gap:18px}
.day-card{display:grid;grid-template-columns:138px minmax(0,1fr) 177px;align-items:center;gap:22px;min-height:154px;padding:22px 24px}
.day-title{align-self:center}
.day-id{font-size:22px;font-weight:650;letter-spacing:-.035em}
.day-date{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin-top:2px}
.timeline-viewport{min-width:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#55717e transparent;padding-bottom:13px}
.timeline{min-width:550px}
.hour-axis{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));margin-bottom:10px}
.hour-label{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#a1b3be;text-align:center}
.timeline-shell{position:relative;margin:0 1px 13px}
.timeline-strip{height:43px;display:grid;grid-template-columns:repeat(48,minmax(0,1fr));overflow:hidden;border-radius:8px;background:#46505a}
.slot{position:relative;min-width:0}
.slot.on{background:var(--green)}
.slot.off{background:var(--red)}
.slot:nth-child(even):not(:last-child)::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(20,33,41,.19)}
.now-marker{position:absolute;z-index:2;top:-5px;bottom:-12px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(13,28,38,.24);pointer-events:none}
.now-marker::after{content:"";position:absolute;bottom:-7px;left:-7px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid #fff}
.periods{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:9px;padding-left:18px;border-left:1px solid var(--border);min-height:102px}
.period{display:flex;align-items:center;gap:12px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text);white-space:nowrap}
.period::before{content:"";width:4px;height:17px;background:var(--red);border-radius:2px;flex:none}
.period.none{color:var(--green)}
.period.none::before{background:var(--green)}
.empty{grid-column:2/4;padding:16px 0;color:var(--muted);font-size:13px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;margin-bottom:20px;font-size:12px;color:var(--muted)}
.footer-left{display:flex;align-items:center;gap:11px}
.footer-icon{width:16px;height:16px;flex:none;color:var(--cyan)}
.footer-right{display:flex;align-items:center;gap:18px}
@media(max-width:1080px){
 .day-card{grid-template-columns:105px minmax(0,1fr);gap:13px;padding:17px}
 .day-id{font-size:18px}
 .periods{grid-column:2;flex-direction:row;flex-wrap:wrap;gap:8px 18px;justify-content:flex-start;min-height:0;padding:8px 0 0;border-left:0;border-top:1px solid var(--border)}
 .period{font-size:11px;gap:7px}
 .period::before{height:13px}
 .empty{grid-column:2}
}
@media(max-width:650px){
 .container{width:calc(100% - 22px)}
 .topbar{padding:14px 0;gap:9px}
 .brand{gap:9px}
 .brand svg{width:21px;height:27px}
 h1{font-size:18px}
 .group{font-size:12px;padding:4px 7px}
 main{padding:12px 0 18px}
 .status-card{align-items:flex-start;flex-direction:column;gap:12px;padding:14px;margin-bottom:12px}
 .status-name{font-size:20px}
 .legend{gap:16px;font-size:11px}
 .legend-color{width:12px;height:12px;border-radius:3px}
 .day-stack{gap:12px}
 .day-card{display:block;min-height:0;padding:13px}
 .day-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
 .day-id{font-size:17px}
 .day-date{font-size:12px}
 .timeline-viewport{padding-bottom:14px}
 .hour-label{font-size:10px}
 .timeline-strip{height:36px}
 .periods{display:flex;gap:8px 16px;padding-top:10px}
 .empty{padding:12px 0}
 .footer{padding:12px;margin-bottom:10px;align-items:flex-start;flex-direction:column;gap:8px;font-size:11px}
}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
    <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 24 32" fill="currentColor"><path d="M12 0 1 18h9L8 32l15-20h-9L17 0z"/></svg>
        <h1>График отключений</h1>
    </div>
    <span class="group">GPV4.2</span>
</header>
<main>
    <section class="status-card unknown" id="status-card" aria-live="polite">
        <div><div class="status-caption">Сейчас</div><div class="status-name" id="current-status">Загрузка…</div></div>
        <div class="legend"><span class="legend-item"><i class="legend-color"></i> Электроэнергия есть</span><span class="legend-item"><i class="legend-color off"></i> Отключение</span></div>
    </section>
    <section class="day-stack" aria-label="Графики отключений">
        <article class="day-card" id="today-card" aria-labelledby="today-label">
            <div class="day-title"><div class="day-id" id="today-label">Сегодня</div><div class="day-date" id="today-date"></div></div>
            <div class="timeline-viewport" id="today-content"><div class="empty">Загрузка…</div></div>
            <div class="periods" id="today-periods"></div>
        </article>
        <article class="day-card tomorrow" id="tomorrow-card" aria-labelledby="tomorrow-label">
            <div class="day-title"><div class="day-id" id="tomorrow-label">Завтра</div><div class="day-date" id="tomorrow-date"></div></div>
            <div class="timeline-viewport" id="tomorrow-content"><div class="empty">Загрузка…</div></div>
            <div class="periods" id="tomorrow-periods"></div>
        </article>
    </section>
</main>
<footer class="footer">
    <div class="footer-left"><svg class="footer-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v6h-6"/></svg><span id="last-update">Обновлено: —</span></div>
    <div class="footer-right"><span>Автообновление: 5 мин</span><a href="https://www.dtek-dnem.com.ua/ua/shutdowns" target="_blank" rel="noopener noreferrer">ДТЭК ↗</a></div>
</footer>
</div>
<script>
const timeZone = 'Europe/Kyiv';
const group = 'GPV4.2';
const dateFormatter = new Intl.DateTimeFormat('en-GB', {timeZone, year:'numeric', month:'2-digit', day:'2-digit'});
let schedules = {};

function dateKey(date) {
    const parts = Object.fromEntries(dateFormatter.formatToParts(date).map(p => [p.type,p.value]));
    return `${parts.year}-${parts.month}-${parts.day}`;
}

function nextDay(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10);
}

function minutesNow() {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {timeZone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p => [p.type,p.value]));
    return Number(parts.hour)*60+Number(parts.minute);
}

function slotsOf(json, key) {
    if (!json || json.group!==group || !json.data) return null;
    const entry = Object.entries(json.data).find(([stamp]) => dateKey(new Date(Number(stamp)*1000))===key);
    if (!entry) return null;
    const hours = entry[1];
    const types = {yes:[true,true], no:[false,false], first:[false,true], second:[true,false]};
    const slots=[];
    for(let i=1;i<=24;i++) {
        if (!Object.hasOwn(types,hours[i])) return null;
        slots.push(...types[hours[i]]);
    }
    return slots;
}

function clockTime(slot) {
    const min = slot*30;
    return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
}

function offPeriods(slots) {
    const periods=[];
    for(let i=0;i<48;) {
        if(slots[i]){i++;continue;}
        const start=i;
        while(i<48&&!slots[i])i++;
        periods.push({start,end:i});
    }
    return periods;
}

function renderTimeline(slots, today) {
    const strip = slots.map(v=>`<div class="slot ${v?'on':'off'}"></div>`).join('');
    const axis = Array.from({length:24},(_,i)=>`<span class="hour-label">${String(i).padStart(2,'0')}</span>`).join('');
    const marker = today?`<div class="now-marker" id="now-marker" style="left:${minutesNow()/1440*100}%" aria-hidden="true"></div>`:'';
    return `<div class="timeline"><div class="hour-axis">${axis}</div><div class="timeline-shell"><div class="timeline-strip">${strip}</div>${marker}</div></div>`;
}

function renderPeriods(slots) {
    const periods=offPeriods(slots);
    return periods.length?periods.map(p=>`<div class="period">${clockTime(p.start)} – ${clockTime(p.end)}</div>`).join(''):'<div class="period none">Отключений нет</div>';
}

async function fetchSchedule(file) {
    const response=await fetch(`${file}?v=${Date.now()}`, {cache:'no-store'});
    if(response.status===404) return null;
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
}

function updateStatus(todaySlots, todayKey) {
    const card=document.getElementById('status-card');
    const title=document.getElementById('current-status');
    const now=new Date();
    const minutes=minutesNow();
    const marker=document.getElementById('now-marker');
    if(marker) marker.style.left=`${minutes/1440*100}%`;
    if(!todaySlots || dateKey(now)!==todayKey){
        card.classList.remove('off');card.classList.add('unknown');title.textContent='Нет данных';return;
    }
    const isOn=todaySlots[Math.min(47,Math.floor(minutes/30))];
    card.classList.remove('unknown');card.classList.toggle('off',!isOn);
    title.textContent=isOn?'Электроэнергия есть':'Отключение';
}

async function loadSchedules() {
    const today=dateKey(new Date());
    const tomorrow=nextDay(today);
    document.getElementById('today-date').textContent=today;
    document.getElementById('tomorrow-date').textContent=tomorrow;
    const items=[['today','today.json',today],['tomorrow','tomorrow.json',tomorrow]];
    const updates={};
    await Promise.all(items.map(async ([name,file,key])=>{
        const content=document.getElementById(`${name}-content`);
        const periods=document.getElementById(`${name}-periods`);
        try {
            const json=await fetchSchedule(file);
            const slots=slotsOf(json,key);
            schedules[name]=slots;
            if(slots){
                content.innerHTML=renderTimeline(slots,name==='today');
                periods.innerHTML=renderPeriods(slots);
                updates[name]=json.update;
            } else {
                content.innerHTML=`<div class="empty">${name==='today'?'График недоступен':'График ещё не опубликован'}</div>`;
                periods.innerHTML='';
            }
        }catch(err){
            schedules[name]=null;
            content.innerHTML='<div class="empty">Ошибка загрузки графика</div>';
            periods.innerHTML='';
            console.error(file,err);
        }
    }));
    document.getElementById('last-update').textContent=`Обновлено: ${updates.today||updates.tomorrow||'—'}`;
    updateStatus(schedules.today,today);
}

loadSchedules();
setInterval(()=>{
    const today=dateKey(new Date());
    if(document.getElementById('today-date').textContent!==today) loadSchedules();
    else updateStatus(schedules.today,today);
},30*1000);
setInterval(loadSchedules,5*60*1000);
</script>
</body>
</html>
